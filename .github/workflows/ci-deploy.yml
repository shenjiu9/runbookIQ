name: CI and deploy Tokyo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runbookiq-tokyo-production
  cancel-in-progress: false

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run pytest -q

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run test
          npm run lint
          npm run build

  deploy:
    if: >-
      ${{
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://rag.xn--bang-fe6gk6c.top/
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable release archive
        run: tar --exclude=.git -czf "/tmp/runbookiq-${GITHUB_SHA}.tar.gz" .
      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.TOKYO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.TOKYO_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.TOKYO_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.TOKYO_KNOWN_HOSTS }}
          TURNSTILE_SITE_KEY: ${{ secrets.RUNBOOKIQ_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.RUNBOOKIQ_TURNSTILE_SECRET_KEY }}
        run: |
          missing=()
          [[ -n "${DEPLOY_HOST}" ]] || missing+=("TOKYO_DEPLOY_HOST")
          [[ -n "${DEPLOY_USER}" ]] || missing+=("TOKYO_DEPLOY_USER")
          [[ -n "${DEPLOY_SSH_KEY}" ]] || missing+=("TOKYO_DEPLOY_SSH_KEY")
          [[ -n "${DEPLOY_KNOWN_HOSTS}" ]] || missing+=("TOKYO_KNOWN_HOSTS")
          [[ -n "${TURNSTILE_SITE_KEY}" ]] || missing+=("RUNBOOKIQ_TURNSTILE_SITE_KEY")
          [[ -n "${TURNSTILE_SECRET_KEY}" ]] || missing+=("RUNBOOKIQ_TURNSTILE_SECRET_KEY")
          if (( ${#missing[@]} > 0 )); then
            printf '缺少 production Environment secret: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          [[ "${TURNSTILE_SITE_KEY}" =~ ^0x[A-Za-z0-9_-]{20,}$ ]]
          [[ "${TURNSTILE_SECRET_KEY}" =~ ^0x[A-Za-z0-9_-]{30,}$ ]]
      - name: Configure deployment SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.TOKYO_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.TOKYO_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/runbookiq-deploy
          chmod 600 ~/.ssh/runbookiq-deploy
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Build protected runtime configuration
        env:
          TURNSTILE_SITE_KEY: ${{ secrets.RUNBOOKIQ_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.RUNBOOKIQ_TURNSTILE_SECRET_KEY }}
        run: |
          umask 077
          runtime_env="/tmp/runbookiq-runtime-${GITHUB_SHA}.env"
          {
            printf 'RUNBOOKIQ_TURNSTILE_SITE_KEY=%s\n' "${TURNSTILE_SITE_KEY}"
            printf 'RUNBOOKIQ_TURNSTILE_SECRET_KEY=%s\n' "${TURNSTILE_SECRET_KEY}"
            printf 'RUNBOOKIQ_TURNSTILE_REQUIRED=true\n'
          } > "${runtime_env}"
          chmod 600 "${runtime_env}"
      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ secrets.TOKYO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.TOKYO_DEPLOY_USER }}
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_options=(
            -i ~/.ssh/runbookiq-deploy
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o StrictHostKeyChecking=yes
          )
          ssh "${ssh_options[@]}" "${target}" \
            "mkdir -p ~/runbookiq/inbox"
          scp "${ssh_options[@]}" \
            "/tmp/runbookiq-${GITHUB_SHA}.tar.gz" \
            "${target}:runbookiq/inbox/${GITHUB_SHA}.tar.gz"
          scp "${ssh_options[@]}" \
            scripts/apply-runtime-secrets.sh \
            "/tmp/runbookiq-runtime-${GITHUB_SHA}.env" \
            "${target}:runbookiq/inbox/"
          ssh "${ssh_options[@]}" "${target}" \
            "chmod 0700 ~/runbookiq/inbox/apply-runtime-secrets.sh && \
              chmod 0600 ~/runbookiq/inbox/runbookiq-runtime-${GITHUB_SHA}.env && \
              bash ~/runbookiq/inbox/apply-runtime-secrets.sh \
                ~/runbookiq/inbox/runbookiq-runtime-${GITHUB_SHA}.env"
          ssh "${ssh_options[@]}" "${target}" \
            "bash ~/runbookiq/bin/deploy-release.sh \
              ~/runbookiq/inbox/${GITHUB_SHA}.tar.gz ${GITHUB_SHA}"
          ssh "${ssh_options[@]}" "${target}" \
            "test \"\$(readlink -f ~/runbookiq/current)\" = \
              \"\$HOME/runbookiq/releases/${GITHUB_SHA}\""
          ssh "${ssh_options[@]}" "${target}" \
            "install -m 0750 \
              ~/runbookiq/current/scripts/deploy-release.sh \
              ~/runbookiq/bin/deploy-release.sh && \
             install -m 0750 \
              ~/runbookiq/current/scripts/apply-runtime-secrets.sh \
              ~/runbookiq/bin/apply-runtime-secrets.sh && \
             rm -f ~/runbookiq/inbox/apply-runtime-secrets.sh"
      - name: Verify public production endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            https://rag.xn--bang-fe6gk6c.top/api/health
          {
            echo "### RunbookIQ production deployed"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: https://rag.xn--bang-fe6gk6c.top/"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Remove temporary deployment credentials
        if: always()
        run: |
          rm -f ~/.ssh/runbookiq-deploy
          rm -f "/tmp/runbookiq-${GITHUB_SHA}.tar.gz"
          rm -f "/tmp/runbookiq-runtime-${GITHUB_SHA}.env"
