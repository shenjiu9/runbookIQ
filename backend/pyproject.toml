[project]
name = "runbookiq"
version = "0.1.0"
description = "Production-oriented incident investigation RAG workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0.39,<3",
  "asyncpg>=0.30,<1",
  "pgvector>=0.4,<1",
  "pypdf>=5.4,<7",
  "python-docx>=1.1,<2",
  "pillow>=11,<13",
  "pytesseract>=0.3.13,<1",
  "pypdfium2>=4.30,<5",
  "fastembed>=0.7,<1",
  "beautifulsoup4>=4.13,<5",
  "markdown-it-py>=3.0,<5",
  "argon2-cffi>=23.1,<26",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.26,<1",
  "asgi-lifespan>=2.1,<3",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runbookiq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
